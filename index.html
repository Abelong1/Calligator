html,body{margin:0;background:#EFE7D2;}

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

.calligator-wrap{
  --yellow:#FFD700;--orange:#FF8C00;--crimson:#DC143C;--olive:#6B8E23;
  --bg:#EFE7D2;--card:#F6F1E1;--ink:#2b2620;--muted:#948c72;
  --maxw:760px;
  font-family:'Plus Jakarta Sans',Arial,sans-serif;
  min-height:100vh;min-height:100dvh;background:var(--bg);
  box-sizing:border-box;
}
.calligator-wrap *{box-sizing:border-box;margin:0;padding:0;}

/* responsive: fills the viewport on phones, centered column on larger screens */
.calligator-wrap .screen{
  width:100%;max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
.calligator-wrap .screen-body{ position:static; }

.calligator-wrap .neu{
  background:var(--card);
  box-shadow: 7px 7px 14px rgba(150,130,80,0.28), -7px -7px 14px rgba(255,255,255,0.75);
}
.calligator-wrap .neu-in{
  background:var(--card);
  box-shadow: inset 4px 4px 8px rgba(150,130,80,0.22), inset -4px -4px 8px rgba(255,255,255,0.7);
}

.calligator-wrap .top{display:flex;justify-content:space-between;align-items:flex-start;padding:30px 22px 0 22px;}
.calligator-wrap .time{display:flex;align-items:baseline;gap:2px;}
.calligator-wrap .time .h1{font-size:40px;font-weight:800;color:var(--crimson);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .time .h2{font-size:40px;font-weight:800;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .date-block{margin-left:10px;}
.calligator-wrap .date-block .d1{font-size:14px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .date-block .d2{font-size:11px;color:var(--muted);}

.calligator-wrap .mascot-strip{margin:16px 22px 0 22px;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;}
.calligator-wrap .mascot-strip img{width:44px;height:44px;object-fit:contain;flex-shrink:0;}
.calligator-wrap .mascot-strip .mt{font-size:13px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .mascot-strip .ms{font-size:10px;color:var(--muted);margin-top:1px;}

.calligator-wrap .grid-uniform{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 22px 0 22px;}
.calligator-wrap .mod-card{border-radius:22px;padding:16px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:128px;box-shadow:0 8px 16px rgba(0,0,0,0.10);cursor:pointer;}
.calligator-wrap .mod-ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.55);display:flex;align-items:center;justify-content:center;}
.calligator-wrap .mod-title{font-size:14px;font-weight:700;color:#2b2620;line-height:1.25;font-family:'Baloo 2',sans-serif;}
.calligator-wrap .mod-sub{font-size:10px;color:rgba(43,38,32,0.65);line-height:1.25;margin-top:2px;}

.calligator-wrap .navbar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));max-width:var(--maxw);margin:0 auto;padding:0 22px;z-index:20;}
.calligator-wrap .navpill{border-radius:26px;height:62px;display:flex;align-items:center;justify-content:space-around;padding:0 10px;}
.calligator-wrap .navitem{color:#b5ac8e;transition:color .15s ease;}
.calligator-wrap .navitem.active{color:var(--crimson);}

.calligator-wrap .header{display:flex;align-items:center;gap:12px;padding:26px 22px 6px 22px;}
.calligator-wrap .back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.calligator-wrap .hlabel{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:700;}

.calligator-wrap .card{margin:16px 22px 0 22px;border-radius:22px;padding:18px;}

.calligator-wrap .namecard{display:flex;align-items:center;gap:16px;}
.calligator-wrap .big-avatar{width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.calligator-wrap .name-block{flex:1;}
.calligator-wrap .name-row{display:flex;align-items:center;gap:8px;}
.calligator-wrap .name-row h2{font-size:19px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .name-row svg{opacity:0.5;}
.calligator-wrap .member-tag{display:inline-block;margin-top:7px;background:rgba(43,38,32,0.08);color:var(--ink);font-size:10px;font-weight:700;padding:4px 11px;border-radius:10px;}

.calligator-wrap .section-title{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:0.2px;margin:24px 22px 10px 22px;font-family:'Baloo 2',sans-serif;}

.calligator-wrap .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.calligator-wrap .avopt{display:flex;flex-direction:column;align-items:center;}
.calligator-wrap .avopt .circle{width:100%;aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;}
.calligator-wrap .avopt.selected .circle{box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--teal, #2FB89A);}

.calligator-wrap .about-card{display:flex;align-items:center;gap:14px;}
.calligator-wrap .about-logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.calligator-wrap .about-text .an{font-size:16px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .about-text .av{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600;}
.calligator-wrap .about-text .ad{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45;}

.calligator-wrap .info-note{display:flex;gap:10px;align-items:flex-start;}
.calligator-wrap .info-note svg{flex-shrink:0;margin-top:1px;color:var(--orange);}
.calligator-wrap .info-note p{font-size:11.5px;color:var(--ink);opacity:0.75;line-height:1.5;}

.calligator-wrap .dev-card{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.calligator-wrap .dev-avatar{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.calligator-wrap .dev-text .dn{font-size:14.5px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .dev-text .dr{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600;}

/* notepad */
.calligator-wrap .note-list{padding:0 22px;display:flex;flex-direction:column;gap:12px;margin-top:4px;}
.calligator-wrap .note-card{border-radius:18px;padding:14px 16px;cursor:pointer;}
.calligator-wrap .note-card-title{font-size:14px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;}
.calligator-wrap .note-card-preview{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.calligator-wrap .note-card-time{font-size:10px;color:rgba(43,38,32,0.45);margin-top:8px;font-weight:600;}

.calligator-wrap .empty-note{text-align:center;padding:34px 22px;}
.calligator-wrap .empty-note p{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px;}

.calligator-wrap .note-editor{display:flex;flex-direction:column;min-height:420px;}
.calligator-wrap .note-title-input{border:none;background:transparent;outline:none;font-size:17px;font-weight:700;color:var(--ink);font-family:'Baloo 2',sans-serif;padding-bottom:10px;}
.calligator-wrap .note-divider{height:1px;background:rgba(43,38,32,0.1);margin-bottom:10px;}
.calligator-wrap .note-body-input{border:none;background:transparent;outline:none;resize:none;flex:1;min-height:340px;font-size:13px;line-height:1.6;color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif;}
.calligator-wrap .note-meta-footer{text-align:center;font-size:10px;color:var(--muted);margin-top:12px;font-weight:600;}

.calligator-wrap .fab{
  position:fixed;right:max(22px, calc((100vw - var(--maxw)) / 2 + 22px));bottom:calc(96px + env(safe-area-inset-bottom));z-index:21;width:54px;height:54px;border-radius:50%;
  background:var(--crimson);border:none;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 20px rgba(220,20,60,0.35);cursor:pointer;
}

@media (min-width:600px){
  .calligator-wrap .grid-uniform{grid-template-columns:repeat(4,1fr);}
  .calligator-wrap .top,.calligator-wrap .header{padding-top:40px;}
}
@media (max-width:360px){
  .calligator-wrap .grid-uniform{gap:10px;padding:16px 14px 0 14px;}
  .calligator-wrap .mascot-strip,.calligator-wrap .card{margin-left:14px;margin-right:14px;}
}
.calligator-wrap svg{max-width:100%;}
.calligator-wrap input,.calligator-wrap select,.calligator-wrap textarea{max-width:100%;font-size:16px;}
`;ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(CalligatorApp,null)),"serviceWorker"in navigator&&location.protocol==="https:"&&navigator.serviceWorker.register("/sw.js").catch(()=>{});

</script>
</body>
</html>
